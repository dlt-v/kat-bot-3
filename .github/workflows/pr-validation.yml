name: PR Validation

on:
  pull_request:
    branches:
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate and run tests
        run: mvn -Pprod clean verify
